name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test
        run: |
          python -m pip install -r build-requirements.txt
          python -m unittest -q test_server_inventory test_online_updates test_updater
      - name: Build and verify program-only package
        run: |
          python build_portable.py
          python verify_public_package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: |
            release/MaterialLedger-*-Windows-x64.zip
            release/release.json
          if-no-files-found: error
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = Get-Content release/release.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "v$($metadata.version)") { throw "Release tag does not match program version" }
          gh release create $env:GITHUB_REF_NAME "release/$($metadata.filename)" release/release.json --verify-tag --title "物料台账 $($metadata.version)" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
